<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dsh-notify-macos client harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  #scroller { overflow-y: auto; height: 260px; width: 480px; border: 1px solid #999; }
  #scroller > div { padding: 2px 4px; }
  #log { white-space: pre-wrap; font: 12px/1.4 monospace; }
</style>
</head>
<body>
  <!-- The scroller the real GUI marks with [data-conversation-scroll]. -->
  <div id="scroller" data-conversation-scroll><div id="content"></div></div>
  <pre id="log"></pre>

  <!-- Module-loader stub must exist BEFORE client.js registers itself. -->
  <script>
    window.__openCalls = [];
    window.__ModuleLoader__ = {
      load: function (entry) { window.__entry = entry; }
    };
  </script>

  <!-- The real client module under test (loaded as the web shell would). -->
  <script src="/lib/client.js"></script>

  <script>
    // Boot driver mirrors the web shell: factory(require) -> api -> apply(ctx).
    (function () {
      // Conversation rows as the real GUI renders them: every flow row carries
      // data-chat-anchor-key, and a finished turn ends with "<n>:turn-tail<T>".
      function appendRow(container, key, kind, height) {
        var d = document.createElement("div");
        d.setAttribute("data-chat-anchor-key", key);
        d.setAttribute("data-chat-flow-key", key);
        if (kind) d.setAttribute("data-chat-flow-kind", kind);
        d.style.height = height + "px";
        d.style.borderBottom = "1px solid #eee";
        d.textContent = key;
        container.appendChild(d);
        return d;
      }

      // Lazy mode mimics the real GUI: only a window of recent turns is
      // rendered, and reaching the top pages older turns in.
      var LAZY = new URLSearchParams(location.search).has("lazy");
      var pendingOlderTurns = [];

      function appendTurn(c, turn) {
        appendRow(c, "14:assistant-step" + turn + ":1", "assistant-step", 180);
        appendRow(c, "9:tool-callcall_" + turn, "tool-call", 120);
        appendRow(c, "call:call_" + turn, null, 40);
        appendRow(c, "9:turn-tail" + turn, "turn-tail", 60);
      }

      // The real GUI pages history in through a button at the top of the list.
      function appendLoadOlder(c) {
        var wrap = document.createElement("div");
        wrap.className = "Md3f7G_older";
        var btn = document.createElement("button");
        btn.textContent = "Load older";
        btn.addEventListener("click", function () {
          if (pendingOlderTurns.length === 0) return;
          var turn = pendingOlderTurns.shift();
          var holder = document.createElement("div");
          appendTurn(holder, turn);
          var first = c.firstChild;
          while (holder.firstChild) c.insertBefore(holder.firstChild, first);
          window.__olderPagesLoaded = (window.__olderPagesLoaded || 0) + 1;
          if (pendingOlderTurns.length === 0) btn.remove();
        });
        wrap.appendChild(btn);
        c.appendChild(wrap);
      }

      function buildRows() {
        var c = document.getElementById("content");
        c.innerHTML = "";
        pendingOlderTurns = [];
        if (LAZY) {
          pendingOlderTurns = [3, 2, 1];     // older pages, loaded on demand
          for (var turn = 4; turn <= 6; turn++) appendTurn(c, turn);
          appendLoadOlder(c);
        } else {
          for (var t = 1; t <= 6; t++) appendTurn(c, t);
        }
      }

      function growContent() { buildRows(); }

      var entry = window.__entry;
      if (!entry || entry.id !== "dsh-notify-macos") {
        throw new Error("client entry was not registered");
      }
      var api = entry.factory(function () {
        throw new Error("client.js must not require() anything in the harness");
      });

      var sessions = {
        open: function (id) {
          window.__openCalls.push(id);
          buildRows();   // re-render the conversation on (re)open
        }
      };
      var booted = true;
      var cleanup = null;
      var ctx = {
        get: function (service) {
          if (service === "sessions") {
            window.__sessionsGets = (window.__sessionsGets || 0) + 1;
            return booted ? sessions : undefined;
          }
          return undefined;
        },
        effect: function (fn) {
          cleanup = fn();
          return {};
        }
      };

      // Simulate history paging: insert rows ABOVE everything (they push the
      // anchored row down, like loaded older messages do).
      function prependRows(count, height) {
        var c = document.getElementById("content");
        for (var i = count; i >= 1; i--) {
          var d = document.createElement("div");
          d.setAttribute("data-chat-anchor-key", "0:older" + i);
          d.setAttribute("data-chat-flow-kind", "older");
          d.style.height = height + "px";
          d.textContent = "older " + i;
          c.insertBefore(d, c.firstChild);
        }
      }

      window.__test = {
        api: api,
        setSessionsBooted: function (b) { booted = b; },
        openCalls: function () { return window.__openCalls.slice(); },
        sessionsGets: function () { return window.__sessionsGets || 0; },
        scroller: function () { return document.getElementById("scroller"); },
        contentHeight: function () { return document.getElementById("content").scrollHeight; },
        cleanup: function () { if (typeof cleanup === "function") cleanup(); },
        prependRows: prependRows
      };

      buildRows();      // static anchored content, like a loaded conversation
      // (lazy mode pages history in through the button rendered by buildRows)
      api.apply(ctx);   // registers hashchange + handles any on-load jump hash
    })();
  </script>
</body>
</html>
