name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  node:
    name: node tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  swift:
    # swift test needs the full XCTest toolchain (present on macOS runners).
    name: swift tests (XCTest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run XCTest suite (dshNotifyCoreTests)
        run: swift test
      # 不依赖 XCTest 的 Core 自检：本机（只有 CLT）也能跑的那部分不变量，
      # 放在这里可以保证它在 CI 上同样有效。
      - name: Run core invariants check (no XCTest)
        run: test/core-local-check.sh
      # 守护进程要发布 universal 二进制：Intel 切片单独编一遍，避免只在 arm64 上悄悄坏掉。
      - name: Cross-build the x86_64 slice (universal binary stays buildable)
        run: swift build -c release --triple x86_64-apple-macosx13.0
      # 平台相关的 host 集成测试（真 unix socket 驱动 apply()）：插件在非 macOS
      # 会主动 early-return，所以这些用例只能在 macOS runner 上跑，ubuntu 的
      # node job 里会被 skipIf 跳过 —— 覆盖缺口由这一步补上。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run macOS-only host integration tests (fake daemon over a real socket)
        run: npx vitest run test/blocked-resolve-integration.test.js

  e2e:
    name: client e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
