name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  node:
    name: node tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  swift:
    # swift test needs the full XCTest toolchain (present on macOS runners).
    name: swift tests (XCTest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run XCTest suite (dshNotifyCoreTests)
        run: swift test
      # 不依赖 XCTest 的 Core 自检：本机（只有 CLT）也能跑的那部分不变量，
      # 放在这里可以保证它在 CI 上同样有效。
      - name: Run core invariants check (no XCTest)
        run: test/core-local-check.sh

  e2e:
    name: client e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
